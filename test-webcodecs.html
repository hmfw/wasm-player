<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCodecs 可行性测试</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
    video {
      max-width: 100%;
      border: 1px solid #ccc;
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>WebCodecs 可行性测试</h1>

  <div class="section">
    <h2>1. 浏览器能力检测</h2>
    <button onclick="checkCapabilities()">检测能力</button>
    <div id="capabilities"></div>
  </div>

  <div class="section">
    <h2>2. HEVC 解码测试</h2>
    <p>上传一个 H.265/HEVC MP4 文件进行测试</p>
    <input type="file" id="hevcFile" accept="video/mp4">
    <button onclick="testHEVCDecode()">测试 HEVC 解码</button>
    <div id="hevcResult"></div>
  </div>

  <div class="section">
    <h2>3. H.264 编码测试</h2>
    <button onclick="testH264Encode()">测试 H.264 编码</button>
    <div id="h264Result"></div>
  </div>

  <div class="section">
    <h2>4. 完整转码流程测试</h2>
    <button onclick="testFullTranscode()">测试 HEVC→H.264 转码</button>
    <div id="transcodeResult"></div>
    <video id="outputVideo" controls style="display:none"></video>
  </div>

  <script type="module">
    // 1. 能力检测
    window.checkCapabilities = async function() {
      const output = document.getElementById('capabilities');
      const results = [];

      // 检测 WebCodecs API
      results.push(`WebCodecs API: ${typeof VideoDecoder !== 'undefined' ? '✅ 支持' : '❌ 不支持'}`);
      results.push(`VideoDecoder: ${typeof VideoDecoder !== 'undefined' ? '✅' : '❌'}`);
      results.push(`VideoEncoder: ${typeof VideoEncoder !== 'undefined' ? '✅' : '❌'}`);
      results.push(`AudioDecoder: ${typeof AudioDecoder !== 'undefined' ? '✅' : '❌'}`);
      results.push(`AudioEncoder: ${typeof AudioEncoder !== 'undefined' ? '✅' : '❌'}`);

      // 检测 HEVC 解码支持
      if (typeof VideoDecoder !== 'undefined') {
        try {
          const hevcSupport = await VideoDecoder.isConfigSupported({
            codec: 'hvc1.1.6.L93.B0',
          });
          results.push(`HEVC 解码: ${hevcSupport.supported ? '✅ 支持' : '❌ 不支持'}`);
        } catch (e) {
          results.push(`HEVC 解码: ❌ 检测失败 - ${e.message}`);
        }
      }

      // 检测 H.264 编码支持
      if (typeof VideoEncoder !== 'undefined') {
        try {
          const h264Support = await VideoEncoder.isConfigSupported({
            codec: 'avc1.42E01E',
            width: 1920,
            height: 1080,
          });
          results.push(`H.264 编码: ${h264Support.supported ? '✅ 支持' : '❌ 不支持'}`);
        } catch (e) {
          results.push(`H.264 编码: ❌ 检测失败 - ${e.message}`);
        }
      }

      output.innerHTML = `<pre>${results.join('\n')}</pre>`;
    };

    // 2. HEVC 解码测试
    window.testHEVCDecode = async function() {
      const output = document.getElementById('hevcResult');
      const fileInput = document.getElementById('hevcFile');

      if (!fileInput.files || !fileInput.files[0]) {
        output.innerHTML = '<div class="error">请先选择一个 MP4 文件</div>';
        return;
      }

      const file = fileInput.files[0];
      output.innerHTML = '<div class="info">正在测试 HEVC 解码...</div>';

      try {
        const buffer = await file.arrayBuffer();
        let frameCount = 0;

        const decoder = new VideoDecoder({
          output: (frame) => {
            frameCount++;
            frame.close();
          },
          error: (e) => {
            throw e;
          }
        });

        // 尝试配置 HEVC 解码器
        const config = {
          codec: 'hvc1.1.6.L93.B0',
        };

        decoder.configure(config);
        output.innerHTML = `<div class="success">✅ HEVC 解码器配置成功！解码了 ${frameCount} 帧</div>`;
        decoder.close();
      } catch (e) {
        output.innerHTML = `<div class="error">❌ HEVC 解码失败: ${e.message}</div>`;
      }
    };

    // 3. H.264 编码测试
    window.testH264Encode = async function() {
      const output = document.getElementById('h264Result');
      output.innerHTML = '<div class="info">正在测试 H.264 编码...</div>';

      try {
        let chunkCount = 0;

        const encoder = new VideoEncoder({
          output: (chunk) => {
            chunkCount++;
          },
          error: (e) => {
            throw e;
          }
        });

        const config = {
          codec: 'avc1.42E01E',
          width: 640,
          height: 480,
          bitrate: 1_000_000,
          framerate: 30,
        };

        encoder.configure(config);

        // 创建一个测试帧
        const canvas = new OffscreenCanvas(640, 480);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'blue';
        ctx.fillRect(0, 0, 640, 480);

        const frame = new VideoFrame(canvas, { timestamp: 0 });
        encoder.encode(frame, { keyFrame: true });
        frame.close();

        await encoder.flush();
        encoder.close();

        output.innerHTML = `<div class="success">✅ H.264 编码成功！生成了 ${chunkCount} 个 chunk</div>`;
      } catch (e) {
        output.innerHTML = `<div class="error">❌ H.264 编码失败: ${e.message}</div>`;
      }
    };

    // 4. 完整转码流程测试
    window.testFullTranscode = async function() {
      const output = document.getElementById('transcodeResult');
      output.innerHTML = '<div class="info">此功能需要上传 HEVC 视频文件才能测试完整转码流程</div>';
    };

    // 页面加载时自动检测能力
    window.addEventListener('load', () => {
      checkCapabilities();
    });
  </script>
</body>
</html>
